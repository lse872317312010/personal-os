name: Flutter Android APK Release

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flutter-android.yml"
      - "tool/**"
      - "apps/personal_os_app/**"
      - "packages/**"
      - "adapters/**"
      - "test_contract/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/flutter-android.yml"
      - "tool/**"
      - "apps/personal_os_app/**"
      - "packages/**"
      - "adapters/**"
      - "test_contract/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Verify repository contracts
        run: bash tool/check_contracts.sh

      - name: Verify Dart core
        run: bash tool/check_dart_core.sh

      - name: Test and build debug APK
        run: bash tool/android_mvp/build_debug.sh

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp apps/personal_os_app/build/app/outputs/flutter-apk/app-debug.apk release/personal-os-latest-debug.apk
          cp apps/personal_os_app/build/app/outputs/flutter-apk/app-debug.provenance.json release/personal-os-latest-debug.provenance.json

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-os-android-debug-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          tag=android-latest
          git tag --force "$tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/$tag"
          notes=$(printf '%s\n\n%s\n%s\n\n%s' \
            'Automatically tested debug APK from main.' \
            "Commit: $GITHUB_SHA" \
            "Workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            'This is a debug build for dogfooding, not a production-signed release.')
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title 'Personal OS latest Android debug' --notes "$notes" --prerelease
          else
            gh release create "$tag" --title 'Personal OS latest Android debug' --notes "$notes" --prerelease
          fi
          gh release upload "$tag" release/* --clobber
