name: Flutter Android APK Release

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flutter-android.yml"
      - "tool/**"
      - "apps/personal_os_app/**"
      - "packages/**"
      - "adapters/**"
      - "test_contract/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/flutter-android.yml"
      - "tool/**"
      - "apps/personal_os_app/**"
      - "packages/**"
      - "adapters/**"
      - "test_contract/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    name: Verify and package Android debug APK
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Install Android API 36
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager_path="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            echo "Android sdkmanager not found at $sdkmanager_path" >&2
            exit 1
          fi
          # sdkmanager exits successfully after consuming the license answers;
          # the producer side of yes may receive the expected SIGPIPE.
          set +o pipefail
          yes | "$sdkmanager_path" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_path" "platforms;android-36"

      - name: Verify repository contracts
        run: bash tool/check_contracts.sh

      - name: Verify Dart core
        run: bash tool/check_dart_core.sh

      - name: Test and build debug APK
        run: bash tool/android_mvp/build_debug.sh

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify SQLCipher persistence on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          working-directory: apps/personal_os_app/android
          script: ./gradlew connectedDebugAndroidTest

      - name: Prepare and verify release assets
        run: bash tool/android_mvp/prepare_release_assets.sh

      - name: Upload verified PR device-test candidate
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: personal-os-redmi-g3-candidate-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  verify-publish-main:
    name: Verify, build, and publish Android debug APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Install Android API 36
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager_path="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            echo "Android sdkmanager not found at $sdkmanager_path" >&2
            exit 1
          fi
          set +o pipefail
          yes | "$sdkmanager_path" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_path" "platforms;android-36"

      - name: Verify repository contracts
        run: bash tool/check_contracts.sh

      - name: Verify Dart core
        run: bash tool/check_dart_core.sh

      - name: Test and build debug APK
        run: bash tool/android_mvp/build_debug.sh

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify SQLCipher persistence on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          working-directory: apps/personal_os_app/android
          script: ./gradlew connectedDebugAndroidTest

      - name: Prepare and verify release assets
        run: bash tool/android_mvp/prepare_release_assets.sh

      - name: Publish rolling release directly
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tool/android_mvp/publish_rolling_release.sh
