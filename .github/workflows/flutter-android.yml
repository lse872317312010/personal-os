name: Flutter Android APK Release

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flutter-android.yml"
      - "tool/**"
      - "apps/personal_os_app/**"
      - "packages/**"
      - "adapters/**"
      - "test_contract/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/flutter-android.yml"
      - "tool/**"
      - "apps/personal_os_app/**"
      - "packages/**"
      - "adapters/**"
      - "test_contract/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    name: Verify and package Android debug APK
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Install Android API 36
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager_path="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            echo "Android sdkmanager not found at $sdkmanager_path" >&2
            exit 1
          fi
          # sdkmanager exits successfully after consuming the license answers;
          # the producer side of yes may receive the expected SIGPIPE.
          set +o pipefail
          yes | "$sdkmanager_path" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_path" "platforms;android-36"

      - name: Verify repository contracts
        run: bash tool/check_contracts.sh

      - name: Verify Dart core
        run: bash tool/check_dart_core.sh

      - name: Test and build debug APK
        run: bash tool/android_mvp/build_debug.sh

      - name: Prepare and verify release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          apk=apps/personal_os_app/build/app/outputs/flutter-apk/app-debug.apk
          provenance=apps/personal_os_app/build/app/outputs/flutter-apk/app-debug.provenance.json
          test -s "$apk"
          test -s "$provenance"
          mkdir -p release
          cp "$apk" release/personal-os-latest-debug.apk
          cp "$provenance" release/personal-os-latest-debug.provenance.json
          sha256sum release/personal-os-latest-debug.apk > release/personal-os-latest-debug.apk.sha256
          APK_SHA256="$(awk '{print $1}' release/personal-os-latest-debug.apk.sha256)" \
          PROVENANCE_PATH="release/personal-os-latest-debug.provenance.json" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          provenance = json.loads(Path(os.environ["PROVENANCE_PATH"]).read_text(encoding="utf-8"))
          expected_sha = os.environ["APK_SHA256"]
          expected_commit = os.environ["GITHUB_SHA"]
          if provenance.get("apk_sha256") != expected_sha:
              raise SystemExit("provenance apk_sha256 does not match the packaged APK")
          if provenance.get("github_sha") != expected_commit:
              raise SystemExit("provenance github_sha does not match GITHUB_SHA")
          if not provenance.get("app_version"):
              raise SystemExit("provenance app_version is empty")
          if provenance.get("model_provider") != "openai":
              raise SystemExit("dogfood APK does not declare the OpenAI provider")
          if provenance.get("model_id") != "gpt-5.4-mini":
              raise SystemExit("dogfood APK does not declare the pinned model")
          PY

  verify-publish-main:
    name: Verify, build, and publish Android debug APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Install Android API 36
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager_path="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            echo "Android sdkmanager not found at $sdkmanager_path" >&2
            exit 1
          fi
          set +o pipefail
          yes | "$sdkmanager_path" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_path" "platforms;android-36"

      - name: Verify repository contracts
        run: bash tool/check_contracts.sh

      - name: Verify Dart core
        run: bash tool/check_dart_core.sh

      - name: Test and build debug APK
        run: bash tool/android_mvp/build_debug.sh

      - name: Prepare and verify release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          apk=apps/personal_os_app/build/app/outputs/flutter-apk/app-debug.apk
          provenance=apps/personal_os_app/build/app/outputs/flutter-apk/app-debug.provenance.json
          test -s "$apk"
          test -s "$provenance"
          mkdir -p release
          cp "$apk" release/personal-os-latest-debug.apk
          cp "$provenance" release/personal-os-latest-debug.provenance.json
          sha256sum release/personal-os-latest-debug.apk > release/personal-os-latest-debug.apk.sha256
          APK_SHA256="$(awk '{print $1}' release/personal-os-latest-debug.apk.sha256)" \
          PROVENANCE_PATH="release/personal-os-latest-debug.provenance.json" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          provenance = json.loads(Path(os.environ["PROVENANCE_PATH"]).read_text(encoding="utf-8"))
          expected_sha = os.environ["APK_SHA256"]
          expected_commit = os.environ["GITHUB_SHA"]
          if provenance.get("apk_sha256") != expected_sha:
              raise SystemExit("provenance apk_sha256 does not match the packaged APK")
          if provenance.get("github_sha") != expected_commit:
              raise SystemExit("provenance github_sha does not match GITHUB_SHA")
          if not provenance.get("app_version"):
              raise SystemExit("provenance app_version is empty")
          if provenance.get("model_provider") != "openai":
              raise SystemExit("dogfood APK does not declare the OpenAI provider")
          if provenance.get("model_id") != "gpt-5.4-mini":
              raise SystemExit("dogfood APK does not declare the pinned model")
          PY

      - name: Publish rolling release directly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          tag=android-latest
          git tag --force "$tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/$tag"
          notes=$(printf '%s\n\n%s\n%s\n\n%s' \
            'Automatically tested debug APK from main.' \
            "Commit: $GITHUB_SHA" \
            "Workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            'This is a debug build for dogfooding, not a production-signed release.')
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title 'Personal OS latest Android debug' --notes "$notes" --prerelease
          else
            gh release create "$tag" --title 'Personal OS latest Android debug' --notes "$notes" --prerelease
          fi
          gh release upload "$tag" release/* --clobber
