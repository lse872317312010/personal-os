name: Prune merged branches

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prune-branches.yml"

permissions:
  contents: write

concurrency:
  group: prune-merged-branches
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete branches fully merged into main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          deleted=0
          retained=0
          while IFS= read -r branch; do
            if [[ "$branch" == "main" ]]; then
              continue
            fi
            encoded=$(jq -rn --arg value "$branch" '$value|@uri')
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$encoded" --jq .status)
            if [[ "$status" == "behind" || "$status" == "identical" ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded"
              echo "Deleted merged branch: $branch"
              deleted=$((deleted + 1))
            else
              echo "Retained unmerged branch: $branch ($status)"
              retained=$((retained + 1))
            fi
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name')
          echo "Deleted merged branches: $deleted; retained unmerged branches: $retained"
