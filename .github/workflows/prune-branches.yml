name: Prune merged branches

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prune-branches.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: prune-merged-branches
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete safely merged branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          deleted=0
          retained=0
          while IFS=$'\t' read -r branch sha; do
            if [[ "$branch" == "main" ]]; then
              continue
            fi
            encoded=$(jq -rn --arg value "$branch" '$value|@uri')
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$encoded" --jq .status)
            merged_prs=$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" \
              --jq '[.[] | select(.merged_at != null)] | length')
            if [[ "$status" == "behind" || "$status" == "identical" || "$merged_prs" -gt 0 ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded"
              echo "Deleted merged branch: $branch (status=$status, merged_prs=$merged_prs)"
              deleted=$((deleted + 1))
            else
              echo "Retained unmerged branch: $branch (status=$status)"
              retained=$((retained + 1))
            fi
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[] | [.name, .commit.sha] | @tsv')
          echo "Deleted merged branches: $deleted; retained unmerged branches: $retained"
