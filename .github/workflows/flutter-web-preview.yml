name: Flutter Web and automatic Agent app

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flutter-web-preview.yml"
      - "apps/personal_os_app/**"
      - "packages/**"
      - "adapters/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
      - "services/agent_gateway/**"
      - "tool/prepare_local_web_font.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/flutter-web-preview.yml"
      - "apps/personal_os_app/**"
      - "packages/**"
      - "adapters/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
      - "services/agent_gateway/**"
      - "tool/prepare_local_web_font.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-web-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test in Chrome
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: apps/personal_os_app
        run: flutter pub get

      - name: Bundle pinned local Chinese font
        run: python3 tool/prepare_local_web_font.py

      - name: Format, analyze, and run widget suite
        working-directory: apps/personal_os_app
        run: |
          set -Eeuo pipefail
          format_paths=(lib/main_web_preview.dart lib/src/app.dart lib/src/agent_interop/agent_handoff.dart lib/src/agent_interop/agent_reply_inbox.dart lib/src/agent_interop/agent_text_share.dart lib/src/composition/app_composition.dart lib/src/controller/strategy_loop_controller.dart lib/src/screens/home_screen.dart lib/src/screens/strategy_loop_screen.dart lib/src/screens/strategy_action_card.dart test/agent_handoff_test.dart test/agent_reply_inbox_test.dart test/agent_text_share_test.dart test/mvp_journey_test.dart test/web_agent_loop_test.dart test/action_first_ui_test.dart test/strategy_cold_start_restore_test.dart test/strategy_loop_controller_test.dart test/app_composition_test.dart ../../packages/application/lib/src/strategy_session_read_model.dart)
          format_paths+=(lib/main_web_agent.dart lib/src/agent_interop/automatic_agent_gateway.dart lib/src/agent_interop/local_agent_event_store.dart lib/src/controller/automatic_agent_controller.dart lib/src/screens/automatic_strategy_screen.dart lib/src/screens/agent_connection_dialog.dart test/automatic_agent_loop_test.dart)
          format_paths+=(../../packages/application/lib/src/strategy_loop_commands.dart ../../packages/application/lib/src/strategy_loop_use_case.dart ../../packages/application/test/strategy_loop_use_case_test.dart ../../packages/events/lib/src/event_types.dart ../../packages/events/lib/src/reducer.dart ../../packages/agent_protocol/lib/src/event_backed_context_source.dart ../../packages/agent_protocol/test/event_backed_context_source_test.dart)
          if ! dart format --output=none --set-exit-if-changed "${format_paths[@]}"; then
            dart format "${format_paths[@]}" >/dev/null
            git diff -- "${format_paths[@]}"
            exit 1
          fi
          flutter analyze
          flutter test

      - name: Run end-to-end journey in Chrome
        working-directory: apps/personal_os_app
        run: flutter test --platform chrome test/mvp_journey_test.dart test/web_agent_loop_test.dart test/action_first_ui_test.dart test/automatic_agent_loop_test.dart

      - name: Build public download page
        working-directory: apps/personal_os_app
        run: flutter build web --release --base-href /personal-os/ --target lib/main_web_preview.dart

      - name: Upload preview build
        uses: actions/upload-artifact@v4
        with:
          name: personal-os-web-preview
          path: apps/personal_os_app/build/web
          if-no-files-found: error
          retention-days: 7

      - name: Build automatic local web app
        working-directory: apps/personal_os_app
        run: flutter build web --release --base-href / --target lib/main_web_agent.dart

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual app startup without external CDNs
        id: web_smoke
        run: node services/agent_gateway/test/built-web-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always() && (steps.web_smoke.outcome == 'success' || steps.web_smoke.outcome == 'failure')
        with:
          name: personal-os-agent-startup
          path: build/automatic-agent-*.png
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: personal-os-agent-web
          path: apps/personal_os_app/build/web
          if-no-files-found: error

  agent-runtime:
    name: Test and package local Agent (${{ matrix.os }})
    needs: verify
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real loopback gateway and protected credentials
        run: node --test services/agent_gateway/test/*.test.mjs
      - uses: actions/download-artifact@v4
        with:
          name: personal-os-agent-web
          path: services/agent_gateway/web
      - name: Include portable Node runtime and provenance
        shell: bash
        run: |
          node -e "const fs=require('node:fs');fs.mkdirSync('services/agent_gateway/runtime',{recursive:true});fs.copyFileSync(process.execPath,'services/agent_gateway/runtime/'+(process.platform==='win32'?'node.exe':'node'));fs.writeFileSync('services/agent_gateway/provenance.json',JSON.stringify({commit:process.env.GITHUB_SHA,node:process.version,platform:process.platform},null,2))"
          cp docs/automatic-agent.md services/agent_gateway/README.md
      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path services/agent_gateway/* -DestinationPath personal-os-automatic-windows.zip
      - name: Package Linux app
        if: runner.os == 'Linux'
        run: |
          chmod +x services/agent_gateway/runtime/node services/agent_gateway/start-personal-os.sh
          cd services/agent_gateway
          zip -qr ../../personal-os-automatic-linux.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: personal-os-automatic-${{ runner.os }}
          path: personal-os-automatic-*.zip
          if-no-files-found: error

  publish-agent:
    name: Publish automatic local app
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: agent-runtime
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: personal-os-automatic-*
          merge-multiple: true
          path: packages
      - name: Publish tested automatic app packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view automatic-agent-web --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create automatic-agent-web --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'Personal OS · 自动 Agent 本机版' --notes '解压 Windows 包后双击 Start-Personal-OS.cmd。首次 Continue with ChatGPT 授权后，行动计划、复盘与下一轮自动请求和接收。包内 provenance.json 记录构建 commit；当前发布不代表已完成真实账户推理验收。'
          fi
          gh release upload automatic-agent-web packages/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          # This is a rolling download channel: its source tag must match the
          # successfully uploaded packages, whose provenance records this SHA.
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/automatic-agent-web" -f sha="$GITHUB_SHA" -F force=true
          cat > release-notes.md <<EOF
          解压 Windows 包后双击 Start-Personal-OS.cmd；Linux 运行 bash start-personal-os.sh。

          首次 Continue with ChatGPT 授权，或在应用内“接入其他 AI”中保存兼容 API / HTTP Agent。行动计划、复盘与下一轮自动请求和接收；切换连接保留目标和历史。

          可主动“测试 AI 连接”确认模型是否响应。个人资料与行动历史分别展开，首页继续突出当前行动。

          目标与现状会在刷新后预填；修改时保存新版本，保留当前行动，下次 AI 请求使用更新后的资料。

          行动卡可直接反馈“完成了 / 这次没做”，说明可选；保存执行与结果后自动复盘，失败重试不重复记录行动。

          构建来源：https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA
          包内 provenance.json 记录同一 commit。当前发布不代表已完成真实账户推理或 Android 真机验收。
          EOF
          gh release edit automatic-agent-web --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md

  deploy:
    name: Publish app download page to GitHub Pages
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download tested web build
        uses: actions/download-artifact@v4
        with:
          name: personal-os-web-preview
          path: site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
