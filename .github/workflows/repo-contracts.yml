name: Repository contracts

on:
  pull_request:
    paths:
      - "adapters/sqlite_vault/**"
      - "adapters/**/pubspec.yaml"
      - "architecture/adapter_classification.json"
      - "apps/personal_os_app/lib/**"
      - "packages/**/lib/**"
      - "tool/check_persistence_boundary.py"
      - "tool/tests/test_check_persistence_boundary.py"
      - "adapters/**/pubspec.yaml"
      - "architecture/adapter_classification.json"
      - "apps/personal_os_app/lib/**"
      - "packages/**/lib/**"
      - "tool/check_persistence_boundary.py"
      - "tool/tests/test_check_persistence_boundary.py"
      - "architecture/RECOVERY_PROTOCOL.md"
      - "evidence/android/**"
      - "fixtures/recovery/**"
      - "tool/contract_audit/**"
      - "tool/mvp_acceptance/**"
      - "evidence/mvp/**"
      - "tool/check_contracts.sh"
      - "tool/validate_local_dependencies.py"
      - "packages/**/pubspec.yaml"
      - "adapters/**/pubspec.yaml"
      - ".github/workflows/repo-contracts.yml"
  push:
    branches: [main, "feature/**"]
    paths:
      - "adapters/sqlite_vault/**"
      - "architecture/RECOVERY_PROTOCOL.md"
      - "evidence/android/**"
      - "fixtures/recovery/**"
      - "tool/contract_audit/**"
      - "tool/mvp_acceptance/**"
      - "evidence/mvp/**"
      - "tool/check_contracts.sh"
      - "tool/validate_local_dependencies.py"
      - "packages/**/pubspec.yaml"
      - "adapters/**/pubspec.yaml"
      - ".github/workflows/repo-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository contracts
        run: bash tool/check_contracts.sh
