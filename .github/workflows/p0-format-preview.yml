name: P0 formatter preview

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.3.4"

      - name: Render formatter diff
        shell: bash
        run: |
          set -Eeuo pipefail
          dart format --output=write \
            packages/application/lib/src/ingest_appearance_from_source_use_case.dart \
            packages/application/test/appearance_use_case_test.dart \
            packages/application/test/ingest_appearance_from_source_use_case_test.dart \
            packages/application/test/ingest_appearance_use_case_test.dart
          git diff -- packages/application
