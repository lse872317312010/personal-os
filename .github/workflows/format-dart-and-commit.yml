name: Normalize Dart formatting

on:
  push:
    branches:
      - "codex/**"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.3.4"
      - run: |
          find packages adapters apps test_contract -type f -name '*.dart' -print0 \
            | xargs -0 dart format --output=write
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.dart'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: normalize Dart formatting [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
