name: WeChat Collector Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/wechat-collector-android.yml"
      - "experiments/wechat-visual-collector/**"

permissions:
  contents: write

concurrency:
  group: wechat-collector-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        working-directory: experiments/wechat-visual-collector
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify and stage APK
        run: |
          set -Eeuo pipefail
          apk=experiments/wechat-visual-collector/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          mkdir -p release
          cp "$apk" release/wechat-visual-collector-v0.2.1-debug.apk
          sha256sum release/wechat-visual-collector-v0.2.1-debug.apk > release/wechat-visual-collector-v0.2.1-debug.apk.sha256
      - name: Publish rolling experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          tag=wechat-collector-latest
          notes="Experimental Redmi/Android accessibility collector built from $HEAD_SHA. This is a debug build for private device testing."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "WeChat collector latest debug" --notes "$notes" --prerelease
          else
            gh release create "$tag" --target "$HEAD_SHA" --title "WeChat collector latest debug" --notes "$notes" --prerelease
          fi
          gh release upload "$tag" release/* --clobber
